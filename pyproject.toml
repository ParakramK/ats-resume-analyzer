[project]
name = "ats-resume-analyzer"
version = "0.1.0"
description = "Privacy-first, bring-your-own-key ATS resume analyzer: deterministic local scoring with optional AI feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                                # asserts are the point of tests
"app.py" = ["S101"]                                  # UI state-narrowing asserts only
"src/ats_analyzer/presentation/**" = ["S101"]        # UI state-narrowing asserts only
"src/ats_analyzer/infrastructure/http_client.py" = ["S311"]  # jitter only, non-crypto

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]
# Streamlit UI is excluded: it is presentation-only glue, guarded by Ruff instead.
# Rationale: Streamlit has no type stubs and its callback flow defeats useful typing.
exclude = ['src/ats_analyzer/presentation/.*']

[[tool.mypy.overrides]]
module = ["streamlit", "pymupdf", "fitz", "docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PyMuPDF (libmupdf SWIG bindings) emits this on import; harmless, out of our control.
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/ats_analyzer"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
